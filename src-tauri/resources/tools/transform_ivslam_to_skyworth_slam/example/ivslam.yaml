## Imu parameters

use_imu: true
Imu.fps: 1000
# noise
Imu.gyro_noise: 3.0e-04         # [ rad / s / sqrt(Hz) ]   ( gyro "white noise" )
Imu.gyro_bias_noise: 2.0e-05     # [ rad / s^2 / sqrt(Hz) ] ( gyro bias diffusion )
Imu.acc_noise: 2.0e-3            # [ m / s^2 / sqrt(Hz) ]   ( accel "white noise" )
Imu.acc_bias_noise: 1.0e-4  # [ m / s^3 / sqrt(Hz) ].  ( accel bias diffusion )

